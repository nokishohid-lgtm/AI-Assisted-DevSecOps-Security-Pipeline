openapi: 3.0.3

info:
  title: DevSecOps Lab API
  version: 1.1.0
  description: >
    Hardened API definition for the DevSecOps security lab.
    The contract documents the validated runtime behavior used by
    automated DAST and CI security testing.

servers:
  - url: http://api:8080

paths:
  /health:
    get:
      operationId: getHealth
      summary: Read API health
      responses:
        "200":
          description: API health response
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum:
                      - healthy
                  service:
                    type: string
                    enum:
                      - api
              example:
                status: healthy
                service: api

        "405":
          description: Unsupported HTTP method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /jobs:
    get:
      operationId: getJobCounts
      summary: Read aggregate job counts by status
      responses:
        "200":
          description: Counts for job statuses present in the database
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int64
                  minimum: 0
              example:
                pending: 1
                done: 2

        "405":
          description: Unsupported HTTP method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: submitJob
      summary: Submit a demonstration job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
            example:
              task: zap-ci-test

      responses:
        "201":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateJobResponse"

        "400":
          description: Invalid JSON or invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "405":
          description: Unsupported HTTP method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "413":
          description: Request body exceeds the maximum allowed size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "415":
          description: Request Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    CreateJobRequest:
      type: object
      required:
        - task
      additionalProperties: false
      properties:
        task:
          type: string
          minLength: 1
          maxLength: 200
          description: Demonstration job task name
          example: zap-ci-test

    CreateJobResponse:
      type: object
      required:
        - id
        - status
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        status:
          type: string
          enum:
            - pending

    ErrorResponse:
      type: object
      required:
        - error
      additionalProperties: false
      properties:
        error:
          type: string
          minLength: 1