name: Full Stack Integration

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-stack:
    name: API and Worker Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build API and worker images
        run: docker compose build api worker

      - name: Start application stack
        run: docker compose up -d --no-build

      - name: Wait for API readiness
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              --max-time 5 \
              http://127.0.0.1:8081/health > /tmp/api-health.json; then
              if jq -e '.status == "healthy" and .service == "api"' \
                /tmp/api-health.json > /dev/null; then
                echo "API health response verified."
                exit 0
              fi
            fi
            sleep 2
          done

          echo "API did not become ready."
          exit 1

      - name: Verify HTTP job reaches done
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports

          payload='{"task":"ci-full-stack-test"}'

          http_code=$(curl --silent --show-error \
            --max-time 10 \
            --output reports/job-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            http://127.0.0.1:8081/jobs)

          test "$http_code" = "201"
          jq -e '.status == "pending"' reports/job-response.json > /dev/null

          job_id=$(jq -er '.id' reports/job-response.json)
          if ! [[ "$job_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid job ID returned by API."
            exit 1
          fi

          completed=false

          for attempt in $(seq 1 30); do
            status=$(docker compose exec -T postgres \
              psql -U devsecops -d devsecops -t -A \
              -v ON_ERROR_STOP=1 \
              -c "SELECT status FROM jobs WHERE id = $job_id;")

            echo "Attempt $attempt: job $job_id status=$status"

            if [ "$status" = "done" ]; then
              completed=true
              break
            fi
            sleep 2
          done

          if [ "$completed" != "true" ]; then
            echo "Job $job_id did not reach done."
            exit 1
          fi

          docker compose exec -T postgres \
            psql -U devsecops -d devsecops -t -A \
            -v ON_ERROR_STOP=1 \
            -c "SELECT row_to_json(j) FROM (
              SELECT id, payload, status, picked_at, done_at
              FROM jobs WHERE id = $job_id
            ) j;" > reports/job-result.json

          jq -e --argjson id "$job_id" --arg payload "$payload" '
            .id == $id
            and .payload == $payload
            and .status == "done"
            and .picked_at != null
            and .done_at != null
          ' reports/job-result.json > /dev/null

          echo "PASS: HTTP-submitted job $job_id reached done." \
            | tee reports/integration-result.txt

      - name: Collect execution evidence
        if: always()
        shell: bash
        run: |
          mkdir -p reports
          git rev-parse HEAD > reports/commit-sha.txt
          docker compose ps -a > reports/container-status.txt 2>&1
          docker compose logs --no-color > reports/container-logs.txt 2>&1
          docker compose images > reports/images.txt 2>&1

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-integration-${{ github.run_id }}
          path: reports/
          if-no-files-found: error
          retention-days: 14

      - name: Clean up CI containers
        if: always()
        run: docker compose down --volumes --remove-orphans