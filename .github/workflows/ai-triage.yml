name: AI Triage

on:
  workflow_run:
    workflows: ["CodeQL Security Scan"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  triage:
    name: Secure AI Triage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Download CodeQL SARIF
        uses: actions/download-artifact@v4
        with:
          name: codeql-results
          path: ./sarif
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find SARIF file
        id: find_sarif
        shell: bash
        run: |
          set -euo pipefail
          SARIF=$(find ./sarif -type f -name "*.sarif" -print -quit)
          if [ -z "$SARIF" ]; then
            echo "::error::No SARIF file found."
            exit 1
          fi
          echo "path=$SARIF" >> "$GITHUB_OUTPUT"


      - name: Run AI triage
        run: python scripts/triage.py "${{ steps.find_sarif.outputs.path }}"
