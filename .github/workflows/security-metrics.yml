name: Security Metrics Validation

on:
  push:
    branches:
      - main
    paths:
      - "scripts/metrics/**"
      - "security-tests/metrics/**"
      - "evidence/phase7-sca/**"
      - "zap-reports/**"
      - ".github/workflows/security-metrics.yml"

  pull_request:
    branches:
      - main
    paths:
      - "scripts/metrics/**"
      - "security-tests/metrics/**"
      - "evidence/phase7-sca/**"
      - "zap-reports/**"
      - ".github/workflows/security-metrics.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-metrics:
    name: Validate Security Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run security metrics regression tests
        run: python security-tests/metrics/test-security-metrics.py

      - name: Collect security metrics
        run: python scripts/metrics/collect-security-metrics.py

      - name: Write security metrics summary
        shell: bash
        run: |
          {
            echo "## Phase 14 Security Metrics"
            echo
            echo '```text'
            python scripts/metrics/collect-security-metrics.py
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"