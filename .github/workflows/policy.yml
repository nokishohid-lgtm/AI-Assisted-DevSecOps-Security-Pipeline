name: Policy Enforcement

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'policy/**'
      - 'k8s/**'
      - 'security-tests/policy/**'
      - '.github/workflows/policy.yml'

permissions:
  contents: read

jobs:
  conftest:
    name: Conftest policy check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Conftest
        run: |
          wget https://github.com/open-policy-agent/conftest/releases/download/v0.55.0/conftest_0.55.0_Linux_x86_64.tar.gz
          tar xzf conftest_0.55.0_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/
          conftest --version

      - name: Validate secure project Dockerfile
        shell: bash
        run: |
          conftest test \
            --policy policy \
            --namespace docker \
            Dockerfile

      - name: Run Docker policy regression tests
        shell: bash
        run: |
          bash security-tests/policy/test-docker-policy-regression.sh