name: Policy Enforcement

"on":
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "Dockerfile.api"
      - "Dockerfile.worker"
      - "policy/**"
      - "k8s/**"
      - "security-tests/policy/**"
      - ".github/workflows/policy.yml"

  pull_request:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "Dockerfile.api"
      - "Dockerfile.worker"
      - "policy/**"
      - "k8s/**"
      - "security-tests/policy/**"
      - ".github/workflows/policy.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  conftest:
    name: Conftest policy check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Show pinned Conftest version
        shell: bash
        run: |
          docker run --rm \
            openpolicyagent/conftest:v0.55.0 \
            --version

      # ------------------------------------------------------------
      # Docker policy validation
      # ------------------------------------------------------------

      - name: Validate main Dockerfile
        shell: bash
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -w /project \
            openpolicyagent/conftest:v0.55.0 \
            test \
            --policy policy \
            --namespace docker \
            Dockerfile

      - name: Validate API Dockerfile
        shell: bash
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -w /project \
            openpolicyagent/conftest:v0.55.0 \
            test \
            --policy policy \
            --namespace docker \
            Dockerfile.api

      - name: Validate worker Dockerfile
        shell: bash
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -w /project \
            openpolicyagent/conftest:v0.55.0 \
            test \
            --policy policy \
            --namespace docker \
            Dockerfile.worker

      - name: Run Docker policy regression tests
        shell: bash
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -w /project \
            --entrypoint sh \
            openpolicyagent/conftest:v0.55.0 \
            security-tests/policy/test-docker-policy-regression.sh

      # ------------------------------------------------------------
      # Production Kubernetes manifest validation
      # ------------------------------------------------------------

      - name: Validate Kubernetes API Deployment
        shell: bash
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -w /project \
            openpolicyagent/conftest:v0.55.0 \
            test \
            --policy policy/kubernetes \
            --namespace kubernetes \
            k8s/base/api/deployment.yaml

      - name: Validate Kubernetes worker Deployment
        shell: bash
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -w /project \
            openpolicyagent/conftest:v0.55.0 \
            test \
            --policy policy/kubernetes \
            --namespace kubernetes \
            k8s/base/worker/deployment.yaml

      - name: Validate Kubernetes PostgreSQL StatefulSet
        shell: bash
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -w /project \
            openpolicyagent/conftest:v0.55.0 \
            test \
            --policy policy/kubernetes \
            --namespace kubernetes \
            k8s/base/postgres/statefulset.yaml

      # ------------------------------------------------------------
      # Kubernetes policy regression matrix
      # ------------------------------------------------------------

      - name: Run Kubernetes policy regression tests
        shell: bash
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -w /project \
            --entrypoint sh \
            openpolicyagent/conftest:v0.55.0 \
            security-tests/policy/kubernetes/test-kubernetes-policy-regression.sh