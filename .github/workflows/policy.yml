name: Policy Enforcement

"on":
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "policy/**"
      - "k8s/**"
      - "security-tests/policy/**"
      - ".github/workflows/policy.yml"

  pull_request:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "policy/**"
      - "k8s/**"
      - "security-tests/policy/**"
      - ".github/workflows/policy.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  conftest:
    name: Conftest policy check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Show pinned Conftest version
        shell: bash
        run: |
          docker run --rm \
            openpolicyagent/conftest:v0.55.0 \
            --version

      - name: Validate secure project Dockerfile
        shell: bash
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -w /project \
            openpolicyagent/conftest:v0.55.0 \
            test \
            --policy policy \
            --namespace docker \
            Dockerfile

      - name: Run Docker policy regression tests
        shell: bash
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -w /project \
            --entrypoint sh \
            openpolicyagent/conftest:v0.55.0 \
            security-tests/policy/test-docker-policy-regression.sh