name: Policy Enforcement

"on":
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "Dockerfile.api"
      - "Dockerfile.worker"
      - "policy/**"
      - "k8s/**"
      - "security-tests/policy/**"
      - ".github/workflows/policy.yml"

  pull_request:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "Dockerfile.api"
      - "Dockerfile.worker"
      - "policy/**"
      - "k8s/**"
      - "security-tests/policy/**"
      - ".github/workflows/policy.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  conftest:
    name: Conftest policy check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Show pinned Conftest version
        shell: bash
        run: |
          docker run --rm \
            openpolicyagent/conftest:v0.55.0 \
            --version

      - name: Validate main Dockerfile
        shell: bash
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -w /project \
            openpolicyagent/conftest:v0.55.0 \
            test \
            --policy policy \
            --namespace docker \
            Dockerfile

      - name: Validate API Dockerfile
        shell: bash
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -w /project \
            openpolicyagent/conftest:v0.55.0 \
            test \
            --policy policy \
            --namespace docker \
            Dockerfile.api

      - name: Validate worker Dockerfile
        shell: bash
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -w /project \
            openpolicyagent/conftest:v0.55.0 \
            test \
            --policy policy \
            --namespace docker \
            Dockerfile.worker

      - name: Run Docker policy regression tests
        shell: bash
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -w /project \
            --entrypoint sh \
            openpolicyagent/conftest:v0.55.0 \
            security-tests/policy/test-docker-policy-regression.sh

      - name: Validate Kubernetes API Deployment
        shell: bash
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -w /project \
            openpolicyagent/conftest:v0.55.0 \
            test \
            --policy policy/kubernetes \
            --namespace kubernetes \
            k8s/base/api/deployment.yaml

      - name: Validate Kubernetes worker Deployment
        shell: bash
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -w /project \
            openpolicyagent/conftest:v0.55.0 \
            test \
            --policy policy/kubernetes \
            --namespace kubernetes \
            k8s/base/worker/deployment.yaml

      - name: Validate Kubernetes PostgreSQL StatefulSet
        shell: bash
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -w /project \
            openpolicyagent/conftest:v0.55.0 \
            test \
            --policy policy/kubernetes \
            --namespace kubernetes \
            k8s/base/postgres/statefulset.yaml

      - name: Validate Kubernetes secure policy fixture
        shell: bash
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -w /project \
            openpolicyagent/conftest:v0.55.0 \
            test \
            --policy policy/kubernetes \
            --namespace kubernetes \
            security-tests/policy/kubernetes/fixtures/pass-deployment.yaml

      - name: Validate Kubernetes missing-namespace rejection
        shell: bash
        run: |
          set +e

          output="$(
            docker run --rm \
              -v "${{ github.workspace }}:/project" \
              -w /project \
              openpolicyagent/conftest:v0.55.0 \
              test \
              --policy policy/kubernetes \
              --namespace kubernetes \
              security-tests/policy/kubernetes/fixtures/fail-missing-namespace.yaml \
              2>&1
          )"

          status=$?

          set -e

          echo "${output}"

          if [ "${status}" -eq 0 ]; then
            echo "::error::Missing-namespace Kubernetes fixture was incorrectly accepted."
            exit 1
          fi

          if ! printf '%s\n' "${output}" | grep -Fq \
            "must explicitly declare metadata.namespace"; then
            echo "::error::Expected missing-namespace policy message was not found."
            exit 1
          fi

          echo "PASS: Missing-namespace Kubernetes fixture was correctly blocked."

      - name: Validate Kubernetes latest-image rejection
        shell: bash
        run: |
          set +e

          output="$(
            docker run --rm \
              -v "${{ github.workspace }}:/project" \
              -w /project \
              openpolicyagent/conftest:v0.55.0 \
              test \
              --policy policy/kubernetes \
              --namespace kubernetes \
              security-tests/policy/kubernetes/fixtures/fail-latest-image.yaml \
              2>&1
          )"

          status=$?

          set -e

          echo "${output}"

          if [ "${status}" -eq 0 ]; then
            echo "::error::Latest-image Kubernetes fixture was incorrectly accepted."
            exit 1
          fi

          if ! printf '%s\n' "${output}" | grep -Fq \
            "must not use image tag :latest"; then
            echo "::error::Expected latest-image policy message was not found."
            exit 1
          fi

          echo "PASS: Latest-image Kubernetes fixture was correctly blocked."

      - name: Validate Kubernetes untagged-image rejection
        shell: bash
        run: |
          set +e

          output="$(
            docker run --rm \
              -v "${{ github.workspace }}:/project" \
              -w /project \
              openpolicyagent/conftest:v0.55.0 \
              test \
              --policy policy/kubernetes \
              --namespace kubernetes \
              security-tests/policy/kubernetes/fixtures/fail-untagged-image.yaml \
              2>&1
          )"

          status=$?

          set -e

          echo "${output}"

          if [ "${status}" -eq 0 ]; then
            echo "::error::Untagged-image Kubernetes fixture was incorrectly accepted."
            exit 1
          fi

          if ! printf '%s\n' "${output}" | grep -Fq \
            "must use an explicit image tag or digest"; then
            echo "::error::Expected untagged-image policy message was not found."
            exit 1
          fi

          echo "PASS: Untagged-image Kubernetes fixture was correctly blocked."

      - name: Validate Kubernetes privileged-container rejection
        shell: bash
        run: |
          set +e

          output="$(
            docker run --rm \
              -v "${{ github.workspace }}:/project" \
              -w /project \
              openpolicyagent/conftest:v0.55.0 \
              test \
              --policy policy/kubernetes \
              --namespace kubernetes \
              security-tests/policy/kubernetes/fixtures/fail-privileged-container.yaml \
              2>&1
          )"

          status=$?

          set -e

          echo "${output}"

          if [ "${status}" -eq 0 ]; then
            echo "::error::Privileged-container Kubernetes fixture was incorrectly accepted."
            exit 1
          fi

          if ! printf '%s\n' "${output}" | grep -Fq \
            "must not run with privileged: true"; then
            echo "::error::Expected privileged-container policy message was not found."
            exit 1
          fi

          echo "PASS: Privileged-container Kubernetes fixture was correctly blocked."