name: Policy Enforcement

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'policy/**'
      - 'k8s/**'
      - '.github/workflows/policy.yml'

permissions:
  contents: read

jobs:
  conftest:
    name: Conftest policy check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Conftest
        run: |
          wget https://github.com/open-policy-agent/conftest/releases/download/v0.55.0/conftest_0.55.0_Linux_x86_64.tar.gz
          tar xzf conftest_0.55.0_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/

      - name: Run policy tests on Dockerfile
        run: conftest test --policy policy Dockerfile