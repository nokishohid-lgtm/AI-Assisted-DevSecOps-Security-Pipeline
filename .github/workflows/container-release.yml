
name: Secure Container Release

"on":
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/nokishohid-lgtm/ai-assisted-devsecops-security-pipeline

concurrency:
  group: secure-container-release
  cancel-in-progress: false

jobs:
  secure-release:
    if: github.ref == 'refs/heads/main'
    name: Scan and Publish Container
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build container image
        run: |
          docker build --pull \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMAGE_NAME}:${GITHUB_SHA}" \
            -t "${IMAGE_NAME}:latest" \
            .

      - name: Block vulnerable container images
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --scanners vuln \
            --pkg-types os \
            --timeout 15m \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish commit-tagged container image
        run: docker push "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Capture published image digest
        id: capture_image_digest
        shell: bash
        run: |
          IMAGE_REF=$(docker image inspect \
            --format '{{index .RepoDigests 0}}' \
            "${IMAGE_NAME}:${GITHUB_SHA}")

          DIGEST="${IMAGE_REF#${IMAGE_NAME}@}"

          if [[ "$IMAGE_REF" != "${IMAGE_NAME}@"* ]] ||
             [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Invalid published image digest."
            exit 1
          fi

          echo "IMAGE_REF=${IMAGE_REF}" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=${DIGEST}" >> "$GITHUB_ENV"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

          echo "Published image: ${IMAGE_REF}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Sign container image by digest
        run: cosign sign --yes "${IMAGE_REF}"

      - name: Verify container signature by digest
        run: |
          cosign verify \
            --certificate-identity="https://github.com/nokishohid-lgtm/AI-Assisted-DevSecOps-Security-Pipeline/.github/workflows/container-release.yml@refs/heads/main" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${IMAGE_REF}"

      - name: Generate signed build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.capture_image_digest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Publish latest after successful verification
        run: docker push "${IMAGE_NAME}:latest"

      - name: Record verified image and provenance
        shell: bash
        run: |
          {
            echo "### Trusted container release"
            echo ""
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Source commit: ${GITHUB_SHA}"
            echo "- Workflow: ${GITHUB_WORKFLOW}"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Image reference: ${IMAGE_REF}"
            echo "- Image digest: ${IMAGE_DIGEST}"
            echo "- Cosign signature: verified"
            echo "- Build provenance: generated"
          } >> "$GITHUB_STEP_SUMMARY"
