name: DevSecOps CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and run automated tests
        run: mvn --batch-mode clean verify

  multi-service-smoke:
    name: Multi-service smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devsecops
          POSTGRES_PASSWORD: devsecops
          POSTGRES_DB: devsecops
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U devsecops"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run integration tests against Postgres
        env:
          DB_URL: jdbc:postgresql://localhost:5432/devsecops
          DB_USER: devsecops
          DB_PASSWORD: devsecops
          RUN_DB_TESTS: "true"
        run: mvn --batch-mode --no-transfer-progress test

      - name: Build API image
        run: docker build --file Dockerfile.api --tag api:ci .

      - name: Build worker image
        run: docker build --file Dockerfile.worker --tag worker:ci .