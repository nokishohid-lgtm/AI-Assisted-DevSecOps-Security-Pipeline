name: ZAP Detection Regression

"on":
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-regression:
    name: Validate ZAP Security Policy Failure
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    env:
      COMPOSE_PROJECT_NAME: zapregression
      POSTGRES_PASSWORD: "ci-${{ github.run_id }}-${{ github.run_attempt }}"

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Prepare regression evidence directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p zap-regression-reports
          chmod 777 zap-regression-reports

          git rev-parse HEAD \
            > zap-regression-reports/commit-sha.txt

          cp security/openapi.yaml \
            zap-regression-reports/openapi.yaml

          cp security/zap-api-rules.tsv \
            zap-regression-reports/zap-api-rules.tsv

          test -s security/openapi.yaml
          test -s security/zap-api-rules.tsv

          echo "Regression evidence directory prepared."

      - name: Convert secure API to controlled vulnerable state
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "src/main/java/com/nokishohid/devsecops/api/ApiMain.java"
          )

          text = path.read_text()

          pattern = re.compile(
              r'\s*exchange\.getResponseHeaders\(\)\.set\(\s*'
              r'"X-Content-Type-Options",\s*'
              r'"nosniff"\s*'
              r'\);\s*'
          )

          updated, count = pattern.subn(
              "\n",
              text,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "Expected X-Content-Type-Options security header block "
                  "was not found exactly once."
              )

          path.write_text(updated)

          print(
              "PASS: Controlled X-Content-Type-Options weakness created."
          )
          PY

          if grep -q '"X-Content-Type-Options"' \
            src/main/java/com/nokishohid/devsecops/api/ApiMain.java; then
            echo "::error::Controlled header removal failed."
            exit 1
          fi

          git diff -- \
            src/main/java/com/nokishohid/devsecops/api/ApiMain.java \
            > zap-regression-reports/controlled-source-diff.txt

          test -s \
            zap-regression-reports/controlled-source-diff.txt

      - name: Build controlled vulnerable application
        run: docker compose build --pull api worker

      - name: Start application stack
        run: docker compose up -d --no-build

      - name: Verify API readiness
        shell: bash
        run: |
          set -euo pipefail

          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error \
              --max-time 5 \
              http://127.0.0.1:8081/health \
              > zap-regression-reports/health.json; then

              if jq -e '
                .status == "healthy" and
                .service == "api"
              ' zap-regression-reports/health.json > /dev/null; then
                echo "API health verified."
                exit 0
              fi
            fi

            sleep 2
          done

          echo "::error::API did not become ready."
          exit 1

      - name: Verify controlled header is missing
        shell: bash
        run: |
          set -euo pipefail

          curl --silent \
            --show-error \
            --dump-header \
              zap-regression-reports/controlled-health-headers.txt \
            --output \
              zap-regression-reports/controlled-health-body.json \
            http://127.0.0.1:8081/health

          if grep -qi '^X-Content-Type-Options:' \
            zap-regression-reports/controlled-health-headers.txt; then
            echo "::error::Controlled vulnerable state was not created."
            exit 1
          fi

          echo "PASS: X-Content-Type-Options is absent at runtime."

      - name: Prepare ZAP scanner
        shell: bash
        run: |
          set -euo pipefail

          docker pull ghcr.io/zaproxy/zaproxy:stable

          docker image inspect \
            ghcr.io/zaproxy/zaproxy:stable \
            --format '{{json .RepoDigests}}' \
            > zap-regression-reports/zap-image-digest.txt

      - name: Run policy-enforced controlled ZAP scan
        shell: bash
        run: |
          set -uo pipefail

          scan_status=0

          timeout 20m docker run --rm \
            --name devsecops-zap-regression \
            --network zapregression_api-db \
            -v "${{ github.workspace }}/security:/zap/spec:ro" \
            -v "${{ github.workspace }}/zap-regression-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
            -t /zap/spec/openapi.yaml \
            -f openapi \
            -c /zap/spec/zap-api-rules.tsv \
            -r zap-regression-report.html \
            -J zap-regression-report.json \
            -w zap-regression-report.md \
            -I \
            -T 5 \
            > zap-regression-reports/zap-console.log 2>&1 \
            || scan_status=$?

          cat zap-regression-reports/zap-console.log

          echo "${scan_status}" \
            > zap-regression-reports/zap-exit-code.txt

          test -s \
            zap-regression-reports/zap-regression-report.html

          test -s \
            zap-regression-reports/zap-regression-report.json

          test -s \
            zap-regression-reports/zap-regression-report.md

          # The controlled vulnerability is expected to trigger
          # the policy-enforced ZAP FAIL state.
          if [ "${scan_status}" -ne 1 ]; then
            echo "::error::Expected ZAP exit code 1, got ${scan_status}."
            exit 1
          fi

          echo "PASS: ZAP security policy returned expected exit code 1."

      - name: Assert missing security header detection
        shell: bash
        run: |
          set -euo pipefail

          REPORT="zap-regression-reports/zap-regression-report.json"

          MATCH_COUNT="$(jq '[
            .. | objects
            | select(
                ((.alert? // "")
                | test("X-Content-Type-Options"; "i"))
                and
                ((.pluginid? // .pluginId? // "") | tostring == "10021")
              )
          ] | length' "${REPORT}")"

          echo "Rule 10021 findings: ${MATCH_COUNT}"

          if [ "${MATCH_COUNT}" -lt 1 ]; then
            echo "::error::Expected ZAP rule 10021 was not detected."
            exit 1
          fi

          grep -q \
            'X-Content-Type-Options Header Missing' \
            zap-regression-reports/zap-console.log

          echo "PASS: ZAP detected controlled rule 10021 failure."

      - name: Confirm regression test outcome
        shell: bash
        run: |
          set -euo pipefail

          EXIT_CODE="$(
            cat zap-regression-reports/zap-exit-code.txt
          )"

          test "${EXIT_CODE}" = "1"

          echo "=============================================="
          echo "PASS: Controlled DAST regression succeeded."
          echo "Expected vulnerable state: detected"
          echo "Expected ZAP policy exit code: 1"
          echo "Expected rule: 10021"
          echo "=============================================="

      - name: Upload ZAP regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zap-regression-security-report
          path: zap-regression-reports/
          if-no-files-found: error
          retention-days: 30

      - name: Restore secure API source
        if: always()
        shell: bash
        run: |
          git restore \
            src/main/java/com/nokishohid/devsecops/api/ApiMain.java

          if ! grep -q '"X-Content-Type-Options"' \
            src/main/java/com/nokishohid/devsecops/api/ApiMain.java; then
            echo "::error::Secure API source restoration failed."
            exit 1
          fi

          echo "PASS: Secure API source restored."

      - name: Clean up regression environment
        if: always()
        shell: bash
        run: |
          docker rm -f devsecops-zap-regression || true
          docker compose down --volumes --remove-orphans