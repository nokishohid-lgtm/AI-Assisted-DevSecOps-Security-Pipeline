name: Gitleaks Secret Scan

"on":
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Detect Hardcoded Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out full Git history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks regression tests
        shell: pwsh
        run: |
          ./security-tests/gitleaks/test-secret-regression.ps1

      - name: Scan repository with pinned Gitleaks
        shell: bash
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            zricethezav/gitleaks:v8.24.3 \
            detect \
            --source /repo \
            --config /repo/.gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1
