name: Advanced CodeQL Detection Regression

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql-regression:
    name: Validate Advanced SAST Detection
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Convert safe fixtures to controlled vulnerable fixtures
        shell: bash
        run: |
          cat > security-tests/codeql/CodeQLCommandInjectionFixture.java <<'JAVA'
          import java.io.IOException;

          /**
           * CONTROLLED TEST CODE ONLY.
           *
           * Runtime-generated command-injection fixture.
           * This vulnerable version is never committed.
           */
          public final class CodeQLCommandInjectionFixture {

              private CodeQLCommandInjectionFixture() {
              }

              public static void main(String[] args) throws IOException {
                  String script = System.getenv("SCRIPTNAME");

                  if (script != null) {
                      Runtime.getRuntime().exec(script);
                  }
              }
          }
          JAVA

          cat > security-tests/codeql/CodeQLSqlInjectionFixture.java <<'JAVA'
          import java.sql.Connection;
          import java.sql.SQLException;
          import java.sql.Statement;

          /**
           * CONTROLLED TEST CODE ONLY.
           *
           * Runtime-generated SQL-injection fixture.
           * This vulnerable version is never committed.
           */
          public final class CodeQLSqlInjectionFixture {

              private CodeQLSqlInjectionFixture() {
              }

              public static void runQuery(
                      Connection connection
              ) throws SQLException {

                  String username = System.getenv("USERNAME");

                  String sql =
                          "SELECT id, username FROM users WHERE username = '"
                                  + username
                                  + "'";

                  try (Statement statement =
                               connection.createStatement()) {

                      statement.executeQuery(sql);
                  }
              }
          }
          JAVA

          cat > security-tests/codeql/CodeQLPathInjectionFixture.java <<'JAVA'
          import java.io.IOException;
          import java.nio.file.Files;
          import java.nio.file.Path;

          /**
           * CONTROLLED TEST CODE ONLY.
           *
           * Runtime-generated path-injection fixture.
           * This vulnerable version is never committed.
           */
          public final class CodeQLPathInjectionFixture {

              private CodeQLPathInjectionFixture() {
              }

              public static String readFile() throws IOException {
                  String filename = System.getenv("FILENAME");

                  if (filename == null) {
                      return "";
                  }

                  Path requestedFile = Path.of(filename);

                  return Files.readString(requestedFile);
              }
          }
          JAVA

          echo "=== Command Injection Fixture ==="
          cat security-tests/codeql/CodeQLCommandInjectionFixture.java

          echo
          echo "=== SQL Injection Fixture ==="
          cat security-tests/codeql/CodeQLSqlInjectionFixture.java

          echo
          echo "=== Path Injection Fixture ==="
          cat security-tests/codeql/CodeQLPathInjectionFixture.java

      - name: Initialize CodeQL regression database
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile controlled SAST fixtures
        shell: bash
        run: |
          mkdir -p .tmp-codeql-regression

          javac \
            -d .tmp-codeql-regression \
            security-tests/codeql/CodeQLCommandInjectionFixture.java \
            security-tests/codeql/CodeQLSqlInjectionFixture.java \
            security-tests/codeql/CodeQLPathInjectionFixture.java

      - name: Analyze controlled fixtures without uploading
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin/advanced-sast-regression"
          output: codeql-regression-sarif
          upload: never
          upload-database: false

      - name: Display detected CodeQL rules
        shell: bash
        run: |
          set -euo pipefail

          SARIF_FILE="$(
            find codeql-regression-sarif \
              -type f \
              -name '*.sarif' \
              | head -n 1
          )"

          if [ -z "${SARIF_FILE}" ]; then
            echo "::error::CodeQL regression SARIF file was not generated."
            exit 1
          fi

          echo "Using SARIF file: ${SARIF_FILE}"

          echo
          echo "Detected CodeQL rule IDs:"

          jq -r '
            .runs[]?
            | .results[]?
            | .ruleId
          ' "${SARIF_FILE}" | sort -u

      - name: Assert command injection detection
        shell: bash
        run: |
          set -euo pipefail

          SARIF_FILE="$(
            find codeql-regression-sarif \
              -type f \
              -name '*.sarif' \
              | head -n 1
          )"

          MATCH_COUNT="$(
            jq '[
              .runs[]?
              | .results[]?
              | select(
                  .ruleId == "java/command-line-injection"
                )
            ] | length' "${SARIF_FILE}"
          )"

          echo "java/command-line-injection findings: ${MATCH_COUNT}"

          if [ "${MATCH_COUNT}" -lt 1 ]; then
            echo "::error::Expected CodeQL command-injection finding was not detected."
            exit 1
          fi

          echo "PASS: CodeQL detected controlled command injection."

      - name: Assert SQL injection detection
        shell: bash
        run: |
          set -euo pipefail

          SARIF_FILE="$(
            find codeql-regression-sarif \
              -type f \
              -name '*.sarif' \
              | head -n 1
          )"

          MATCH_COUNT="$(
            jq '[
              .runs[]?
              | .results[]?
              | select(
                  .ruleId == "java/sql-injection"
                )
            ] | length' "${SARIF_FILE}"
          )"

          echo "java/sql-injection findings: ${MATCH_COUNT}"

          if [ "${MATCH_COUNT}" -lt 1 ]; then
            echo "::error::Expected CodeQL SQL-injection finding was not detected."
            exit 1
          fi

          echo "PASS: CodeQL detected controlled SQL injection."

      - name: Assert path injection detection
        shell: bash
        run: |
          set -euo pipefail

          SARIF_FILE="$(
            find codeql-regression-sarif \
              -type f \
              -name '*.sarif' \
              | head -n 1
          )"

          MATCH_COUNT="$(
            jq '[
              .runs[]?
              | .results[]?
              | select(
                  .ruleId == "java/path-injection"
                )
            ] | length' "${SARIF_FILE}"
          )"

          echo "java/path-injection findings: ${MATCH_COUNT}"

          if [ "${MATCH_COUNT}" -lt 1 ]; then
            echo "::error::Expected CodeQL path-injection finding was not detected."
            exit 1
          fi

          echo "PASS: CodeQL detected controlled path injection."

      - name: Restore safe regression fixtures
        if: always()
        shell: bash
        run: |
          git checkout -- \
            security-tests/codeql/CodeQLCommandInjectionFixture.java \
            security-tests/codeql/CodeQLSqlInjectionFixture.java \
            security-tests/codeql/CodeQLPathInjectionFixture.java

          rm -rf .tmp-codeql-regression
