name: CodeQL Detection Regression

"on":
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql-regression:
    name: Validate Command Injection Detection
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Generate runtime-only vulnerable fixture
        shell: bash
        run: |
          mkdir -p src/main/java/com/nokishohid/devsecops/securitytest

          cat > src/main/java/com/nokishohid/devsecops/securitytest/CodeQLCommandInjectionFixture.java <<'EOF'
          package com.nokishohid.devsecops.securitytest;

          import java.io.IOException;

          /**
           * Phase 4 CodeQL regression validation fixture.
           *
           * TEST CODE ONLY.
           * Generated only during CI execution.
           * Never committed to the repository.
           */
          public final class CodeQLCommandInjectionFixture {

              private CodeQLCommandInjectionFixture() {
              }

              public static void main(String[] args) throws IOException {
                  String script = System.getenv("SCRIPTNAME");

                  if (script != null) {
                      Runtime.getRuntime().exec(script);
                  }
              }
          }
          EOF

      - name: Initialize CodeQL regression database
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml
          debug: true

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build application with runtime fixture
        shell: bash
        run: |
          mvn --batch-mode clean package

      - name: Analyze regression fixture without uploading
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin/regression"
          output: codeql-regression-sarif
          upload: never
          upload-database: false

      - name: Assert command injection finding
        shell: bash
        run: |
          set -euo pipefail

          SARIF_FILE="$(find codeql-regression-sarif -type f -name '*.sarif' | head -n 1)"

          if [ -z "${SARIF_FILE}" ]; then
            echo "::error::CodeQL regression SARIF file was not generated."
            exit 1
          fi

          echo "Using SARIF file: ${SARIF_FILE}"

          echo "Detected CodeQL rule IDs:"
          jq -r '
            .runs[]?
            | .results[]?
            | .ruleId
          ' "${SARIF_FILE}" | sort -u

          MATCH_COUNT="$(jq '[
            .runs[]?
            | .results[]?
            | select(.ruleId == "java/command-line-injection")
          ] | length' "${SARIF_FILE}")"

          echo "java/command-line-injection findings: ${MATCH_COUNT}"

          if [ "${MATCH_COUNT}" -lt 1 ]; then
            echo "::error::Expected CodeQL command-injection finding was not detected."
            exit 1
          fi

          echo "PASS: CodeQL detected the controlled command-injection fixture."

      - name: Remove runtime fixture
        if: always()
        shell: bash
        run: |
          rm -f src/main/java/com/nokishohid/devsecops/securitytest/CodeQLCommandInjectionFixture.java
          rmdir src/main/java/com/nokishohid/devsecops/securitytest 2>/dev/null || true
