name: Advanced CodeQL Detection Regression

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulnerable-regression:
    name: Validate Controlled Vulnerable SAST Fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Convert safe fixtures to controlled vulnerable fixtures
        shell: bash
        run: |
          cat > security-tests/codeql/CodeQLCommandInjectionFixture.java <<'JAVA'
          import java.io.IOException;

          /**
           * CONTROLLED TEST CODE ONLY.
           *
           * Runtime-generated command-injection fixture.
           * This vulnerable version is never committed.
           */
          public final class CodeQLCommandInjectionFixture {

              private CodeQLCommandInjectionFixture() {
              }

              public static void main(String[] args) throws IOException {
                  String script = System.getenv("SCRIPTNAME");

                  if (script != null) {
                      Runtime.getRuntime().exec(script);
                  }
              }
          }
          JAVA

          cat > security-tests/codeql/CodeQLSqlInjectionFixture.java <<'JAVA'
          import java.sql.Connection;
          import java.sql.SQLException;
          import java.sql.Statement;

          /**
           * CONTROLLED TEST CODE ONLY.
           *
           * Runtime-generated SQL-injection fixture.
           * This vulnerable version is never committed.
           */
          public final class CodeQLSqlInjectionFixture {

              private CodeQLSqlInjectionFixture() {
              }

              public static void runQuery(
                      Connection connection
              ) throws SQLException {

                  String username = System.getenv("USERNAME");

                  String sql =
                          "SELECT id, username FROM users WHERE username = '"
                                  + username
                                  + "'";

                  try (Statement statement =
                               connection.createStatement()) {

                      statement.executeQuery(sql);
                  }
              }
          }
          JAVA

          cat > security-tests/codeql/CodeQLPathInjectionFixture.java <<'JAVA'
          import java.io.IOException;
          import java.nio.file.Files;
          import java.nio.file.Path;

          /**
           * CONTROLLED TEST CODE ONLY.
           *
           * Runtime-generated path-injection fixture.
           * This vulnerable version is never committed.
           */
          public final class CodeQLPathInjectionFixture {

              private CodeQLPathInjectionFixture() {
              }

              public static String readFile() throws IOException {
                  String filename = System.getenv("FILENAME");

                  if (filename == null) {
                      return "";
                  }

                  Path requestedFile = Path.of(filename);

                  return Files.readString(requestedFile);
              }
          }
          JAVA

          cat > security-tests/codeql/CodeQLLogInjectionFixture.java <<'JAVA'
          import java.util.logging.Logger;

          /**
           * CONTROLLED TEST CODE ONLY.
           *
           * Runtime-generated log-injection fixture.
           * This vulnerable version is never committed.
           */
          public final class CodeQLLogInjectionFixture {

              private static final Logger LOGGER =
                      Logger.getLogger(
                              CodeQLLogInjectionFixture.class.getName()
                      );

              private CodeQLLogInjectionFixture() {
              }

              public static void logUsername() {
                  String username = System.getenv("USERNAME");

                  if (username != null) {
                      LOGGER.info("User login: " + username);
                  }
              }
          }
          JAVA

          echo "=== Command Injection Fixture ==="
          cat security-tests/codeql/CodeQLCommandInjectionFixture.java

          echo
          echo "=== SQL Injection Fixture ==="
          cat security-tests/codeql/CodeQLSqlInjectionFixture.java

          echo
          echo "=== Path Injection Fixture ==="
          cat security-tests/codeql/CodeQLPathInjectionFixture.java

          echo
          echo "=== Log Injection Fixture ==="
          cat security-tests/codeql/CodeQLLogInjectionFixture.java

      - name: Initialize vulnerable CodeQL database
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile controlled vulnerable fixtures
        shell: bash
        run: |
          mkdir -p .tmp-codeql-vulnerable

          javac \
            -d .tmp-codeql-vulnerable \
            security-tests/codeql/CodeQLCommandInjectionFixture.java \
            security-tests/codeql/CodeQLSqlInjectionFixture.java \
            security-tests/codeql/CodeQLPathInjectionFixture.java \
            security-tests/codeql/CodeQLLogInjectionFixture.java

      - name: Analyze controlled vulnerable fixtures
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin/advanced-sast-vulnerable"
          output: codeql-vulnerable-sarif
          upload: never
          upload-database: false

      - name: Validate all expected vulnerable SARIF findings
        shell: bash
        run: |
          set -euo pipefail

          SARIF_FILE="$(
            find codeql-vulnerable-sarif \
              -type f \
              -name '*.sarif' \
              | head -n 1
          )"

          if [ -z "${SARIF_FILE}" ]; then
            echo "::error::Vulnerable-state SARIF file was not generated."
            exit 1
          fi

          bash security-tests/codeql/assert-sarif-rules.sh \
            "${SARIF_FILE}" \
            security-tests/codeql/expected-sarif-rules.txt

      - name: Restore safe regression fixtures
        if: always()
        shell: bash
        run: |
          git checkout -- \
            security-tests/codeql/CodeQLCommandInjectionFixture.java \
            security-tests/codeql/CodeQLSqlInjectionFixture.java \
            security-tests/codeql/CodeQLPathInjectionFixture.java \
            security-tests/codeql/CodeQLLogInjectionFixture.java

          rm -rf .tmp-codeql-vulnerable

  remediated-regression:
    name: Validate Remediated Safe SAST Fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Display committed safe fixtures
        shell: bash
        run: |
          echo "=== Safe Command Injection Fixture ==="
          cat security-tests/codeql/CodeQLCommandInjectionFixture.java

          echo
          echo "=== Safe SQL Injection Fixture ==="
          cat security-tests/codeql/CodeQLSqlInjectionFixture.java

          echo
          echo "=== Safe Path Injection Fixture ==="
          cat security-tests/codeql/CodeQLPathInjectionFixture.java

          echo
          echo "=== Safe Log Injection Fixture ==="
          cat security-tests/codeql/CodeQLLogInjectionFixture.java

      - name: Initialize remediated CodeQL database
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile committed safe fixtures
        shell: bash
        run: |
          mkdir -p .tmp-codeql-remediated

          javac \
            -d .tmp-codeql-remediated \
            security-tests/codeql/CodeQLCommandInjectionFixture.java \
            security-tests/codeql/CodeQLSqlInjectionFixture.java \
            security-tests/codeql/CodeQLPathInjectionFixture.java \
            security-tests/codeql/CodeQLLogInjectionFixture.java

      - name: Analyze committed safe fixtures
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin/advanced-sast-remediated"
          output: codeql-remediated-sarif
          upload: never
          upload-database: false

      - name: Validate remediated SARIF contains no protected findings
        shell: bash
        run: |
          set -euo pipefail

          SARIF_FILE="$(
            find codeql-remediated-sarif \
              -type f \
              -name '*.sarif' \
              | head -n 1
          )"

          if [ -z "${SARIF_FILE}" ]; then
            echo "::error::Remediated-state SARIF file was not generated."
            exit 1
          fi

          bash security-tests/codeql/assert-remediated-sarif.sh \
            "${SARIF_FILE}" \
            security-tests/codeql/expected-sarif-rules.txt

      - name: Clean remediation validation workspace
        if: always()
        shell: bash
        run: |
          rm -rf .tmp-codeql-remediated
