name: CodeQL Detection Regression

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql-regression:
    name: Validate Command Injection Detection
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Convert safe fixture to controlled vulnerable fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("security-tests/codeql/CodeQLCommandInjectionFixture.java")
          text = path.read_text()

          text = text.replace(
              'String script = "codeql-regression-safe-value";',
              'String script = System.getenv("SCRIPTNAME");'
          )

          text = text.replace(
              'System.out.println(script);',
              'Runtime.getRuntime().exec(script);'
          )

          path.write_text(text)
          PY

          echo "Runtime regression fixture:"
          cat security-tests/codeql/CodeQLCommandInjectionFixture.java

      - name: Initialize CodeQL regression database
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile controlled regression fixture
        shell: bash
        run: |
          mkdir -p .tmp-codeql-regression
          javac \
            -d .tmp-codeql-regression \
            security-tests/codeql/CodeQLCommandInjectionFixture.java

      - name: Analyze regression fixture without uploading
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin/regression"
          output: codeql-regression-sarif
          upload: never
          upload-database: false

      - name: Assert command injection finding
        shell: bash
        run: |
          set -euo pipefail

          SARIF_FILE="$(find codeql-regression-sarif -type f -name '*.sarif' | head -n 1)"

          if [ -z "${SARIF_FILE}" ]; then
            echo "::error::CodeQL regression SARIF file was not generated."
            exit 1
          fi

          echo "Using SARIF file: ${SARIF_FILE}"

          echo "Detected CodeQL rule IDs:"
          jq -r '
            .runs[]?
            | .results[]?
            | .ruleId
          ' "${SARIF_FILE}" | sort -u

          MATCH_COUNT="$(jq '[
            .runs[]?
            | .results[]?
            | select(.ruleId == "java/command-line-injection")
          ] | length' "${SARIF_FILE}")"

          echo "java/command-line-injection findings: ${MATCH_COUNT}"

          if [ "${MATCH_COUNT}" -lt 1 ]; then
            echo "::error::Expected CodeQL command-injection finding was not detected."
            exit 1
          fi

          echo "PASS: CodeQL detected the controlled command-injection fixture."

      - name: Restore safe regression fixture
        if: always()
        shell: bash
        run: |
          git checkout -- security-tests/codeql/CodeQLCommandInjectionFixture.java
          rm -rf .tmp-codeql-regression
