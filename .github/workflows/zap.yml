name: OWASP ZAP Dynamic Security Scan

"on":
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-scan:
    name: Build, Run, and Scan Application
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build --pull -t devsecops-security-app:${{ github.sha }} .

      - name: Start hardened application container
        run: |
          docker run -d \
            --name devsecops-security-container \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --memory 256m \
            --cpus 1.0 \
            -p 8080:8080 \
            devsecops-security-app:${{ github.sha }}

      - name: Verify application health
        run: |
          for attempt in {1..30}; do
            if curl --fail http://localhost:8080/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs devsecops-security-container
          exit 1

      - name: Create ZAP report directory
        run: mkdir -p zap-reports

      - name: Run OWASP ZAP baseline scan
        run: |
          docker run --rm \
            --add-host host.docker.internal:host-gateway \
            -v "${{ github.workspace }}/zap-reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://host.docker.internal:8080 \
            -r zap-baseline-report.html \
            -I

      - name: Upload ZAP security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-report
          path: zap-reports/zap-baseline-report.html
          if-no-files-found: warn

      - name: Stop application container
        if: always()
        run: docker rm -f devsecops-security-container || true