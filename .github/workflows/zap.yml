name: OWASP ZAP Dynamic Security Scan

"on":
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-scan:
    name: Build, Run, and Scan Application
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    env:
      COMPOSE_PROJECT_NAME: zapci

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Prepare report directory
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports
          git rev-parse HEAD > zap-reports/commit-sha.txt
          cp security/openapi.yaml zap-reports/openapi.yaml

      - name: Build API and worker images
        run: docker compose build --pull api worker

      - name: Start application stack
        run: docker compose up -d --no-build

      - name: Verify API readiness
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              --max-time 5 \
              http://127.0.0.1:8081/health \
              > zap-reports/health.json; then
              if jq -e '
                .status == "healthy" and .service == "api"
              ' zap-reports/health.json > /dev/null; then
                echo "API health verified."
                exit 0
              fi
            fi
            sleep 2
          done

          echo "::error::API did not become ready."
          exit 1

      - name: Verify GET and POST jobs endpoints
        shell: bash
        run: |
          set -euo pipefail

          code=$(curl --silent --show-error \
            --max-time 10 \
            --output zap-reports/job-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"task":"zap-readiness-test"}' \
            http://127.0.0.1:8081/jobs)

          test "$code" = "201"
          jq -e '
            (.id | type == "number") and .status == "pending"
          ' zap-reports/job-response.json > /dev/null

          code=$(curl --silent --show-error \
            --max-time 10 \
            --output zap-reports/job-counts.json \
            --write-out '%{http_code}' \
            http://127.0.0.1:8081/jobs)

          test "$code" = "200"
          jq -e 'type == "object"' \
            zap-reports/job-counts.json > /dev/null

          echo "GET /health, GET /jobs, and POST /jobs verified." \
            | tee zap-reports/endpoint-checks.txt

      - name: Prepare ZAP scanner
        run: |
          docker pull ghcr.io/zaproxy/zaproxy:stable
          docker image inspect ghcr.io/zaproxy/zaproxy:stable \
            --format '{{json .RepoDigests}}' \
            > zap-reports/zap-image-digest.txt

      - name: Run ZAP API scan
        shell: bash
        run: |
          set -euo pipefail
          scan_status=0

          timeout 20m docker run --rm \
            --name devsecops-zap-scanner \
            --network zapci_devsecops \
            -v "${{ github.workspace }}/security:/zap/spec:ro" \
            -v "${{ github.workspace }}/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
            -t /zap/spec/openapi.yaml \
            -f openapi \
            -r zap-api-report.html \
            -J zap-api-report.json \
            -w zap-api-report.md \
            -T 5 \
            > zap-reports/zap-console.log 2>&1 \
            || scan_status=$?

          cat zap-reports/zap-console.log
          echo "$scan_status" > zap-reports/zap-exit-code.txt

          test -s zap-reports/zap-api-report.html
          test -s zap-reports/zap-api-report.json
          jq -e '
            (.site | type == "array") and (.site | length > 0)
          ' zap-reports/zap-api-report.json > /dev/null

          case "$scan_status" in
            0)
              echo "ZAP scan completed without WARN or FAIL results."
              ;;
            1)
              echo "::error::ZAP reported FAIL results. Review the reports."
              ;;
            2)
              echo "::error::ZAP reported warnings requiring review."
              ;;
            *)
              echo "::error::ZAP execution failed with exit code ${scan_status}."
              ;;
          esac

          exit "$scan_status"

      - name: Collect application diagnostics
        if: always()
        run: |
          mkdir -p zap-reports
          docker compose ps -a \
            > zap-reports/container-status.txt 2>&1
          docker compose logs --no-color \
            > zap-reports/container-logs.txt 2>&1

      - name: Upload API scan reports and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-api-security-report
          path: zap-reports/
          if-no-files-found: error
          retention-days: 30

      - name: Clean up CI containers
        if: always()
        run: |
          docker rm -f devsecops-zap-scanner || true
          docker compose down --volumes --remove-orphans