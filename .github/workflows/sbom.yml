name: CycloneDX SBOM Generation

"on":
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-sbom:
    name: Generate API and Worker SBOMs
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build API image
        run: |
          docker build --pull \
            -f Dockerfile.api \
            -t devsecops-api:${{ github.sha }} .

      - name: Build worker image
        run: |
          docker build --pull \
            -f Dockerfile.worker \
            -t devsecops-worker:${{ github.sha }} .

      - name: Create writable SBOM directory
        run: |
          mkdir -p sbom-output
          chmod 777 sbom-output

      - name: Generate API CycloneDX SBOM
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}/sbom-output:/output" \
            anchore/syft:latest \
            devsecops-api:${{ github.sha }} \
            -o cyclonedx-json=/output/api-sbom.cdx.json

      - name: Generate worker CycloneDX SBOM
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}/sbom-output:/output" \
            anchore/syft:latest \
            devsecops-worker:${{ github.sha }} \
            -o cyclonedx-json=/output/worker-sbom.cdx.json

      - name: Validate generated SBOMs
        run: |
          test -s sbom-output/api-sbom.cdx.json
          test -s sbom-output/worker-sbom.cdx.json
          jq -e '.components | length > 0' sbom-output/api-sbom.cdx.json
          jq -e '.components | length > 0' sbom-output/worker-sbom.cdx.json

      - name: Upload API CycloneDX SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-cyclonedx-sbom
          path: sbom-output/api-sbom.cdx.json
          if-no-files-found: error

      - name: Upload worker CycloneDX SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-cyclonedx-sbom
          path: sbom-output/worker-sbom.cdx.json
          if-no-files-found: error
