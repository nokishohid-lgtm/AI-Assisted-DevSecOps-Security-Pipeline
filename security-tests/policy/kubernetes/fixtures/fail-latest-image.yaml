apiVersion: apps/v1
kind: Deployment
metadata:
  name: latest-image-test
  namespace: devsecops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: latest-image-test
  template:
    metadata:
      labels:
        app: latest-image-test
    spec:
      containers:
        - name: app
          image: example/app:latest
