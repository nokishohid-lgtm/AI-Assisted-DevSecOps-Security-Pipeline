apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-policy-pass
  namespace: devsecops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resource-policy-pass
  template:
    metadata:
      labels:
        app: resource-policy-pass
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: example/app:1.0.0
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL