apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-test
  namespace: devsecops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-test
  template:
    metadata:
      labels:
        app: secure-test
    spec:
      containers:
        - name: app
          image: example/app:1.0.0
