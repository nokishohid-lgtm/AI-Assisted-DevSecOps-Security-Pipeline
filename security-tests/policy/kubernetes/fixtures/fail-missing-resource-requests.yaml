apiVersion: apps/v1
kind: Deployment
metadata:
  name: missing-resource-requests
  namespace: devsecops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: missing-resource-requests
  template:
    metadata:
      labels:
        app: missing-resource-requests
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: example/app:1.0.0
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL