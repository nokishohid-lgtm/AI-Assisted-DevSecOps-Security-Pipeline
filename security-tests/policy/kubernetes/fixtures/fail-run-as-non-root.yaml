apiVersion: apps/v1
kind: Deployment
metadata:
  name: missing-run-as-non-root
  namespace: devsecops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: missing-run-as-non-root
  template:
    metadata:
      labels:
        app: missing-run-as-non-root
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: example/app:1.0.0
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
