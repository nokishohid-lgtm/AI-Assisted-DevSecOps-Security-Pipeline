apiVersion: apps/v1
kind: Deployment
metadata:
  name: capabilities-test
  namespace: devsecops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: capabilities-test
  template:
    metadata:
      labels:
        app: capabilities-test
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: example/app:1.0.0
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: []
