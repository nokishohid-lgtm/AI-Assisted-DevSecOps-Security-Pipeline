apiVersion: apps/v1
kind: Deployment
metadata:
  name: missing-seccomp-test
  namespace: devsecops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: missing-seccomp-test
  template:
    metadata:
      labels:
        app: missing-seccomp-test
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: example/app:1.0.0
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
