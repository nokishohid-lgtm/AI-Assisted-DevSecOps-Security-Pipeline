apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: devsecops
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: devsecops-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ai-assisted-devsecops-security-pipeline-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres.devsecops.svc.cluster.local:5432/devsecops
          envFrom:
            - secretRef:
                name: postgres-credentials
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi